name: Build JinPad 1.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
          accept-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract JinPad 1.0
        run: |
          rm -rf JinPad
          unzip -o JinPad-1.0.0.zip
          test -f JinPad/settings.gradle.kts

      - name: Build APK
        run: |
          cd JinPad
          gradle clean :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh JinPad/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JinPad-1.0-APK
          path: JinPad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
