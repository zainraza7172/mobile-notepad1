name: Build Jin Notepad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
          accept-android-sdk-licenses: false

      - name: Accept licenses and install Android SDK 37
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and patch Jin Notepad
        run: |
          unzip -o JinNotepad-MVP-0.1.0.zip
          chmod +x JinNotepad/gradlew

          # Fix missing Compose setContent import
          grep -q "import androidx.activity.compose.setContent" \
          JinNotepad/app/src/main/java/com/jin/notepad/MainActivity.kt || \
          sed -i '/import androidx.activity.compose.rememberLauncherForActivityResult/a import androidx.activity.compose.setContent' \
          JinNotepad/app/src/main/java/com/jin/notepad/MainActivity.kt

          # Upgrade compileSdk from 36 to 37
          sed -i 's/compileSdk = 36/compileSdk = 37/' \
          JinNotepad/app/build.gradle.kts

          echo "===== Android config ====="
          grep -n "compileSdk" JinNotepad/app/build.gradle.kts

          echo "===== setContent check ====="
          grep -n "setContent" \
          JinNotepad/app/src/main/java/com/jin/notepad/MainActivity.kt

      - name: Build Jin Notepad APK
        run: |
          cd JinNotepad
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f JinNotepad/app/build/outputs/apk/debug/app-debug.apk
          ls -lh JinNotepad/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jin-Notepad-APK
          path: JinNotepad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
