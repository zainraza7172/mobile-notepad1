name: Build Jin Notepad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract Jin Notepad project
        run: |
          unzip -o JinNotepad-MVP-0.1.0.zip
          echo "Project extracted"
          ls -la
          ls -la JinNotepad

      - name: Build Debug APK
        run: |
          cd JinNotepad
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jin-Notepad-APK
          path: JinNotepad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
