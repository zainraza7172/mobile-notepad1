name: Build Jin Notepad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
          accept-android-sdk-licenses: false

      - name: Accept licenses and install Android SDK 36
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and fix Jin Notepad project
        run: |
          unzip -o JinNotepad-MVP-0.1.0.zip
          chmod +x JinNotepad/gradlew

          sed -i '/import androidx.activity.compose.rememberLauncherForActivityResult/a import androidx.activity.compose.setContent' \
          JinNotepad/app/src/main/java/com/jin/notepad/MainActivity.kt

          echo "Checking MainActivity imports..."
          grep -n "androidx.activity.compose" \
          JinNotepad/app/src/main/java/com/jin/notepad/MainActivity.kt

          echo "Project extracted and patched successfully"

      - name: Build Jin Notepad APK
        run: |
          cd JinNotepad
          ./gradlew :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh JinNotepad/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jin-Notepad-APK
          path: JinNotepad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
