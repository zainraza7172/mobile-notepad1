name: Build Jin Notepad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
          accept-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Jin Notepad
        run: |
          unzip -o JinNotepad-MVP-0.1.1-FIXED.zip
          chmod +x JinNotepad/gradlew

      - name: Build Jin Notepad APK
        run: |
          cd JinNotepad
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh JinNotepad/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jin-Notepad-APK
          path: JinNotepad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
