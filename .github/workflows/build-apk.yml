name: Build Signed Notepad 1.0 Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
          accept-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Notepad Final
        run: |
          unzip -o Notepad-FINAL-1.0.0.zip
          chmod +x Notepad/gradlew

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTEPAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing NOTEPAD_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/notepad-release-key.jks"

      - name: Build signed release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.NOTEPAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTEPAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOTEPAD_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing signing secrets" && exit 1)
          cd Notepad
          ./gradlew clean :app:assembleRelease :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/notepad-release-key.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Verify outputs
        run: |
          ls -lh Notepad/app/build/outputs/apk/release/app-release.apk
          ls -lh Notepad/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-1.0-SIGNED-APK
          path: Notepad/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-1.0-PLAY-AAB
          path: Notepad/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
